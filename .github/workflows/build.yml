name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Instruction budgets
        if: ${{ !cancelled() }}
        run: node tools/check-instructions.mjs

      - name: Install
        id: install
        run: npm ci

      - name: Save the npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Changed files carry no new dashes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF...HEAD" -z \
            | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files

      - name: Copy follows the register
        if: ${{ !cancelled() }}
        run: node tools/check-copy.mjs --check

      - name: Audit
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=moderate

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Check internal links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --offline
            --include-fragments
            --index-files index.html
            --root-dir "${{ github.workspace }}/dist"
            ./dist
          fail: true

      - name: Lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Build with the App Store listing
        id: build-store
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_IOS_APP_STORE_URL: https://apps.apple.com/us/app/orbit/id1234567890
