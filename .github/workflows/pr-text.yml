name: PR Text

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

# Every run reads the live title and body, so a newer event on the same pull request and head makes
# an older run redundant. The group is the pull request and its head commit: a run never cancels the
# check of another head, or of another pull request at the same head.
concurrency:
  group: pr-text-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-text:
    name: PR Text
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          persist-credentials: false

      # The cone-mode sparse checkout keeps the root files, .node-version included.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read the live title and body
        id: read
        # Bot PR bodies quote upstream prose that this repository cannot edit.
        if: github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull-request.json"
          jq -r '.title' "$RUNNER_TEMP/pull-request.json" > "$RUNNER_TEMP/pr-title.txt"
          jq -r '.body // ""' "$RUNNER_TEMP/pull-request.json" > "$RUNNER_TEMP/pr-body.md"

      - name: Title and body carry no dashes
        if: ${{ !cancelled() && steps.read.outcome == 'success' }}
        run: node tools/check-dashes.mjs --text "$(cat "$RUNNER_TEMP/pr-title.txt") $(cat "$RUNNER_TEMP/pr-body.md")"

      - name: Body carries no attribution lines
        if: ${{ !cancelled() && steps.read.outcome == 'success' }}
        run: node tools/check-attribution.mjs --body-file "$RUNNER_TEMP/pr-body.md"
