name: Deploy landing

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://useorbit.org/

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Deploy approved commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_LANDING_SERVICE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const sha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const { RENDER_API_KEY, RENDER_SERVICE_ID, GH_TOKEN, GITHUB_REPOSITORY, GITHUB_RUN_ID } = process.env;
          if (!RENDER_API_KEY || !RENDER_SERVICE_ID || !GH_TOKEN) {
            throw new Error("Configure RENDER_API_KEY and RENDER_LANDING_SERVICE_ID in the production environment");
          }

          const renderUrl = `https://api.render.com/v1/services/${encodeURIComponent(RENDER_SERVICE_ID)}`;
          const renderHeaders = {
            Authorization: `Bearer ${RENDER_API_KEY}`,
            Accept: "application/json",
          };
          const githubUrl = `https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments`;
          const githubHeaders = {
            Authorization: `Bearer ${GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2026-03-10",
          };

          async function jsonRequest(url, options = {}) {
            const response = await fetch(url, { ...options, signal: AbortSignal.timeout(30_000) });
            const body = await response.text();
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}: ${body}`);
            return JSON.parse(body);
          }

          const service = await jsonRequest(renderUrl, { headers: renderHeaders });
          if (service.autoDeploy !== "no") {
            throw new Error("The Render landing service must have auto-deploy disabled");
          }

          const deploy = await jsonRequest(`${renderUrl}/deploys`, {
            method: "POST",
            headers: { ...renderHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({ commitId: sha }),
          });
          if (!deploy.id) throw new Error("Render did not return a deploy ID");
          console.log(`Render deploy ${deploy.id} for ${sha}`);

          let live = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const current = await jsonRequest(`${renderUrl}/deploys/${deploy.id}`, { headers: renderHeaders });
            if (current.commit?.id && current.commit.id !== sha) {
              throw new Error(`Render is deploying ${current.commit.id} instead of ${sha}`);
            }
            console.log(`Render status: ${current.status}`);
            if (current.status === "live") {
              if (current.commit?.id !== sha) throw new Error("Render did not confirm the deployed SHA");
              live = true;
              break;
            }
            if (["build_failed", "update_failed", "pre_deploy_failed", "canceled", "deactivated"].includes(current.status)) {
              throw new Error(`Render deploy ended with ${current.status}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          if (!live) throw new Error("Render deploy did not go live before the timeout");

          let healthy = false;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch("https://useorbit.org/", {
                redirect: "manual",
                signal: AbortSignal.timeout(15_000),
              });
              if (response.status === 200) {
                healthy = true;
                break;
              }
              console.log(`Landing returned HTTP ${response.status}`);
            } catch (error) {
              console.log(`Landing health check failed: ${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }
          if (!healthy) throw new Error("https://useorbit.org/ did not return HTTP 200");

          const deployment = await jsonRequest(githubUrl, {
            method: "POST",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              ref: sha,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              description: "Render landing release",
            }),
          });
          if (deployment.sha !== sha) throw new Error("GitHub Deployment did not record the deployed SHA");

          await jsonRequest(`${githubUrl}/${deployment.id}/statuses`, {
            method: "POST",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              state: "success",
              environment_url: "https://useorbit.org/",
              log_url: `https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`,
              description: "Render deploy is live and the landing returned HTTP 200",
            }),
          });
          console.log(`GitHub Deployment ${deployment.id} succeeded for ${sha}`);
          NODE
