name: Release landing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Render environment to deploy
        type: choice
        options:
          - production
          - staging
        required: true
      branch:
        description: Git branch to deploy
        type: string
        required: true
        default: main
      sha:
        description: Full commit SHA (required for staging; production defaults to the dispatch commit)
        type: string
        required: false
      force_unstaged:
        description: Release production without a matching healthy staging commit
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ inputs.environment }}-landing
  cancel-in-progress: false

jobs:
  production:
    if: inputs.environment == 'production'
    name: Release production landing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://useorbit.org/

    steps:
      - name: Validate release selection
        id: selection
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main" >&2
            exit 1
          fi
          if [[ "$RELEASE_ENVIRONMENT" != "production" || "$RELEASE_BRANCH" != "main" ]]; then
            echo "Production releases must deploy main" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$RELEASE_BRANCH"
          if [[ -z "$RELEASE_SHA" ]]; then
            RELEASE_SHA="$DISPATCH_SHA"
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Select a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected commit
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ steps.selection.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "Checkout does not match the selected release SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "The selected release SHA is not reachable from $RELEASE_BRANCH" >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Deploy selected commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_LANDING_SERVICE_ID }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_LANDING_STAGING_SERVICE_ID }}
          RELEASE_SHA: ${{ steps.selection.outputs.sha }}
          FORCE_UNSTAGED: ${{ inputs.force_unstaged }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const sha = process.env.RELEASE_SHA;
          const {
            RENDER_API_KEY, RENDER_PRODUCTION_SERVICE_ID, GH_TOKEN, GITHUB_REPOSITORY, GITHUB_RUN_ID,
            RENDER_STAGING_SERVICE_ID, FORCE_UNSTAGED, GITHUB_STEP_SUMMARY,
          } = process.env;
          if (!RENDER_API_KEY || !RENDER_PRODUCTION_SERVICE_ID || !GH_TOKEN) {
            throw new Error("Configure the production environment secret RENDER_API_KEY and variable RENDER_LANDING_SERVICE_ID");
          }

          const renderUrl = `https://api.render.com/v1/services/${encodeURIComponent(RENDER_PRODUCTION_SERVICE_ID)}`;
          const renderHeaders = {
            Authorization: `Bearer ${RENDER_API_KEY}`,
            Accept: "application/json",
          };
          const githubUrl = `https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments`;
          const githubHeaders = {
            Authorization: `Bearer ${GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2026-03-10",
          };

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          // Render answers 201 with the deploy, or 202 Queued with no body; an empty body parses as null.
          async function jsonRequest(url, options = {}) {
            const response = await fetch(url, { ...options, signal: AbortSignal.timeout(30_000) });
            const body = await response.text();
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}: ${body}`);
            return body.trim() === "" ? null : JSON.parse(body);
          }

          appendFileSync(GITHUB_STEP_SUMMARY,
            `## Production staging admission\nSelected SHA: ${sha}\nforce_unstaged: ${FORCE_UNSTAGED}\n`);
          if (FORCE_UNSTAGED === "true") {
            console.log(`Operator override force_unstaged permits production release of ${sha} without staging admission`);
          } else {
            if (!RENDER_STAGING_SERVICE_ID) throw new Error("Configure the repository variable RENDER_LANDING_STAGING_SERVICE_ID");
            const stagingService = await jsonRequest(
              `https://api.render.com/v1/services/${encodeURIComponent(RENDER_STAGING_SERVICE_ID)}`,
              { headers: renderHeaders },
            );
            const stagingOrigin = stagingService.serviceDetails?.url;
            if (!stagingOrigin) throw new Error("Render did not return the staging landing service URL");
            const url = new URL("/", stagingOrigin);
            url.searchParams.set("orbit-verify", crypto.randomUUID());
            const response = await fetch(url, {
              redirect: "manual",
              cache: "no-store",
              signal: AbortSignal.timeout(30_000),
            });
            const html = response.status === 200 ? await response.text() : "";
            const commit = html.match(/<meta name="orbit-build" content="([0-9a-f]{40})"/)?.[1];
            if (response.status !== 200 || commit !== sha) {
              throw new Error(`Staging must serve ${sha} with HTTP 200 before production release; got HTTP ${response.status} serving ${commit ?? "no build marker"}; force_unstaged is the explicit override`);
            }
            appendFileSync(GITHUB_STEP_SUMMARY, `Staging served ${sha} with HTTP 200\n`);
          }

          const service = await jsonRequest(renderUrl, { headers: renderHeaders });
          if (service.autoDeploy !== "no") {
            throw new Error("The Render landing service must have auto-deploy disabled");
          }
          const serviceOrigin = service.serviceDetails?.url;
          if (!serviceOrigin) throw new Error("Render did not return the landing service URL");

          const triggeredAt = Date.now();
          let deploy = await jsonRequest(`${renderUrl}/deploys`, {
            method: "POST",
            headers: { ...renderHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({ commitId: sha }),
          });
          for (let attempt = 0; !deploy?.id && attempt < 30; attempt++) {
            await sleep(5_000);
            const recent = await jsonRequest(`${renderUrl}/deploys?limit=20`, { headers: renderHeaders });
            deploy = (recent ?? [])
              .map((entry) => entry.deploy)
              .find((entry) => entry?.commit?.id === sha && Date.parse(entry.createdAt) >= triggeredAt - 60_000);
          }
          if (!deploy?.id) throw new Error(`Render did not create a deploy for ${sha}`);
          console.log(`Render deploy ${deploy.id} for ${sha}`);

          let live = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const current = await jsonRequest(`${renderUrl}/deploys/${deploy.id}`, { headers: renderHeaders });
            if (current.commit?.id && current.commit.id !== sha) {
              throw new Error(`Render is deploying ${current.commit.id} instead of ${sha}`);
            }
            console.log(`Render status: ${current.status}`);
            if (current.status === "live") {
              if (current.commit?.id !== sha) throw new Error("Render did not confirm the deployed SHA");
              live = true;
              break;
            }
            if (["build_failed", "update_failed", "pre_deploy_failed", "canceled", "deactivated"].includes(current.status)) {
              throw new Error(`Render deploy ended with ${current.status}`);
            }
            await sleep(10_000);
          }
          if (!live) throw new Error("Render deploy did not go live before the timeout");

          const verificationStarted = performance.now();
          const verificationDeadline = verificationStarted + 300_000;

          async function servedCommit(origin) {
            const url = new URL("/", origin);
            url.searchParams.set("orbit-verify", crypto.randomUUID());
            const remaining = Math.max(1, Math.ceil(verificationDeadline - performance.now()));
            const response = await fetch(url, {
              redirect: "manual",
              cache: "no-store",
              signal: AbortSignal.timeout(Math.min(15_000, remaining)),
            });
            if (response.status !== 200) return { status: response.status, commit: null };
            const html = await response.text();
            return { status: 200, commit: html.match(/<meta name="orbit-build" content="([0-9a-f]{40})"/)?.[1] ?? null };
          }

          async function requireServedCommit(origin) {
            while (performance.now() < verificationDeadline) {
              try {
                const result = await servedCommit(origin);
                if (result.status === 200 && result.commit === sha && performance.now() <= verificationDeadline) {
                  console.log(`${origin} serves ${sha} after ${Math.round(performance.now() - verificationStarted)} ms`);
                  return;
                }
                console.log(`${origin} returned HTTP ${result.status} serving ${result.commit ?? "no build marker"}`);
              } catch (error) {
                console.log(`${origin} check failed: ${error.message}`);
              }
              const remaining = verificationDeadline - performance.now();
              if (remaining > 0) await sleep(Math.min(5_000, remaining));
            }
            throw new Error(`${origin}/ does not serve ${sha} within 300000 ms of Render going live`);
          }

          await requireServedCommit(serviceOrigin);
          await requireServedCommit("https://useorbit.org");
          const environmentUrl = "https://useorbit.org/";

          const deployment = await jsonRequest(githubUrl, {
            method: "POST",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              ref: sha,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              description: "Render landing release",
            }),
          });
          if (deployment.sha !== sha) throw new Error("GitHub Deployment did not record the deployed SHA");

          await jsonRequest(`${githubUrl}/${deployment.id}/statuses`, {
            method: "POST",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              state: "success",
              environment_url: environmentUrl,
              log_url: `https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`,
              description: "Render deploy is live and serves the deployed commit",
            }),
          });
          console.log(`GitHub Deployment ${deployment.id} succeeded for ${sha}`);
          appendFileSync(GITHUB_STEP_SUMMARY, `## Landing production release\nDeployed SHA: ${sha}\n`);
          NODE

  staging:
    if: inputs.environment == 'staging'
    name: Release staging landing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Validate release selection
        id: selection
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_BRANCH" || "$RELEASE_BRANCH" == refs/* ]]; then
            echo "Select a staging branch name" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$RELEASE_BRANCH"
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Select a full 40-character commit SHA; staging requires an explicit SHA" >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.selection.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected commit
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ steps.selection.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "Checkout does not match the selected release SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "The selected release SHA is not reachable from $RELEASE_BRANCH" >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Deploy and verify selected commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_LANDING_STAGING_SERVICE_ID }}
          PUBLIC_APP_URL: https://app-staging.useorbit.org
          PUBLIC_ANDROID_INSTALL_URL: https://play.google.com/store/apps/details?id=org.useorbit.app.staging
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_SHA: ${{ steps.selection.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const sha = process.env.RELEASE_SHA;
          const {
            RENDER_API_KEY, RENDER_STAGING_SERVICE_ID, RELEASE_BRANCH, GH_TOKEN, GITHUB_REPOSITORY, GITHUB_RUN_ID,
            GITHUB_STEP_SUMMARY,
          } = process.env;
          if (!RENDER_API_KEY || !RENDER_STAGING_SERVICE_ID || !GH_TOKEN) {
            throw new Error("Configure the staging environment secret RENDER_API_KEY and variable RENDER_LANDING_STAGING_SERVICE_ID");
          }

          const renderUrl = `https://api.render.com/v1/services/${encodeURIComponent(RENDER_STAGING_SERVICE_ID)}`;
          const renderHeaders = {
            Authorization: `Bearer ${RENDER_API_KEY}`,
            Accept: "application/json",
          };
          const githubUrl = `https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments`;
          const githubHeaders = {
            Authorization: `Bearer ${GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2026-03-10",
          };
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          // Render answers 201 with the deploy, or 202 Queued with no body; an empty body parses as null.
          async function jsonRequest(url, options = {}) {
            const response = await fetch(url, { ...options, signal: AbortSignal.timeout(30_000) });
            const body = await response.text();
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}: ${body}`);
            return body.trim() === "" ? null : JSON.parse(body);
          }

          const service = await jsonRequest(renderUrl, { headers: renderHeaders });
          if (service.autoDeploy !== "no") {
            throw new Error("The Render landing service must have auto-deploy disabled");
          }
          const serviceOrigin = service.serviceDetails?.url;
          if (!serviceOrigin) throw new Error("Render did not return the landing service URL");

          const buildVariables = await jsonRequest(`${renderUrl}/env-vars?limit=100`, { headers: renderHeaders });
          for (const key of ["PUBLIC_APP_URL", "PUBLIC_ANDROID_INSTALL_URL"]) {
            const configured = buildVariables.find(({ envVar }) => envVar.key === key)?.envVar.value;
            if (configured !== process.env[key]) {
              throw new Error(`Set the Render staging build variable ${key} to ${process.env[key]} before releasing`);
            }
          }

          const updated = await jsonRequest(renderUrl, {
            method: "PATCH",
            headers: { ...renderHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({ branch: RELEASE_BRANCH }),
          });
          if (updated.branch !== RELEASE_BRANCH) {
            throw new Error(`Render did not select staging branch ${RELEASE_BRANCH}`);
          }

          const triggeredAt = Date.now();
          let deploy = await jsonRequest(`${renderUrl}/deploys`, {
            method: "POST",
            headers: { ...renderHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({ commitId: sha }),
          });
          for (let attempt = 0; !deploy?.id && attempt < 30; attempt++) {
            await sleep(5_000);
            const recent = await jsonRequest(`${renderUrl}/deploys?limit=20`, { headers: renderHeaders });
            deploy = (recent ?? [])
              .map((entry) => entry.deploy)
              .find((entry) => entry?.commit?.id === sha && Date.parse(entry.createdAt) >= triggeredAt - 60_000);
          }
          if (!deploy?.id) throw new Error(`Render did not create a deploy for ${sha}`);
          console.log(`Render deploy ${deploy.id} for ${sha}`);

          let live = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const current = await jsonRequest(`${renderUrl}/deploys/${deploy.id}`, { headers: renderHeaders });
            if (current.commit?.id && current.commit.id !== sha) {
              throw new Error(`Render is deploying ${current.commit.id} instead of ${sha}`);
            }
            console.log(`Render status: ${current.status}`);
            if (current.status === "live") {
              if (current.commit?.id !== sha) throw new Error("Render did not confirm the deployed SHA");
              live = true;
              break;
            }
            if (["build_failed", "update_failed", "pre_deploy_failed", "canceled", "deactivated"].includes(current.status)) {
              throw new Error(`Render deploy ended with ${current.status}`);
            }
            await sleep(10_000);
          }
          if (!live) throw new Error("Render deploy did not go live before the timeout");

          const verificationStarted = performance.now();
          const verificationDeadline = verificationStarted + 300_000;

          async function servedCommit(origin) {
            const url = new URL("/", origin);
            url.searchParams.set("orbit-verify", crypto.randomUUID());
            const remaining = Math.max(1, Math.ceil(verificationDeadline - performance.now()));
            const response = await fetch(url, {
              redirect: "manual",
              cache: "no-store",
              signal: AbortSignal.timeout(Math.min(15_000, remaining)),
            });
            if (response.status !== 200) return { status: response.status, commit: null };
            const html = await response.text();
            return { status: 200, commit: html.match(/<meta name="orbit-build" content="([0-9a-f]{40})"/)?.[1] ?? null };
          }

          async function requireServedCommit(origin) {
            while (performance.now() < verificationDeadline) {
              try {
                const result = await servedCommit(origin);
                if (result.status === 200 && result.commit === sha && performance.now() <= verificationDeadline) {
                  console.log(`${origin} serves ${sha} after ${Math.round(performance.now() - verificationStarted)} ms`);
                  return;
                }
                console.log(`${origin} returned HTTP ${result.status} serving ${result.commit ?? "no build marker"}`);
              } catch (error) {
                console.log(`${origin} check failed: ${error.message}`);
              }
              const remaining = verificationDeadline - performance.now();
              if (remaining > 0) await sleep(Math.min(5_000, remaining));
            }
            throw new Error(`${origin}/ does not serve ${sha} within 300000 ms of Render going live`);
          }

          await requireServedCommit(serviceOrigin);

          const deployment = await jsonRequest(githubUrl, {
            method: "POST",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              ref: sha,
              environment: "staging",
              auto_merge: false,
              required_contexts: [],
              description: "Render landing release",
            }),
          });
          if (deployment.sha !== sha) throw new Error("GitHub Deployment did not record the deployed SHA");
          await jsonRequest(`${githubUrl}/${deployment.id}/statuses`, {
            method: "POST",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              state: "success",
              environment_url: `${serviceOrigin}/`,
              log_url: `https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`,
              description: "Render deploy is live and serves the deployed commit",
            }),
          });
          console.log(`GitHub Deployment ${deployment.id} succeeded for ${sha}`);
          appendFileSync(GITHUB_STEP_SUMMARY, `## Landing staging release\nDeployed SHA: ${sha}\n`);
          NODE
